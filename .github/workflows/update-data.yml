name: 실거래 데이터 갱신

on:
  schedule:
    - cron: "0 21 1 * *"   # 매월 2일 06:00 KST
  workflow_dispatch:
    inputs:
      months:
        description: "다시 받을 최근 개월 수 (처음은 13)"
        default: "2"
        required: true
      sgg:
        description: "특정 시군구만 (쉼표로, 비우면 전체)"
        default: ""
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 실거래 받아서 요약 만들기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/update_data.py --months ${{ github.event.inputs.months || '2' }} --sgg "${{ github.event.inputs.sgg || '' }}"
      - name: 커밋·푸시
        run: |
          git config user.name "jipteo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "실거래 데이터 갱신 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
